name: Generate OCL

on:
  push:
    paths:
      - "*.sh"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-ocl:
    if: github.ref_name != 'automation/ocl-sync'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate changed OCL
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          changed_file="$(mktemp)"
          before_sha="${{ github.event.before }}"

          if [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files '*.sh' >"${changed_file}"
          else
            git diff --name-only --diff-filter=AM "${before_sha}" "${{ github.sha }}" >"${changed_file}"
          fi

          ./scripts/sync_changed_scripts.sh "${changed_file}" ".octopus/process-templates"

          if ! ./scripts/has_generated_changes.sh .octopus/process-templates; then
            echo "has_changes=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "has_changes=true" >>"${GITHUB_OUTPUT}"
          {
            echo "changed_scripts<<EOF"
            ./scripts/list_changed_scripts.sh <"${changed_file}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: Create pull request
        if: steps.sync.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ocl-sync
          commit-message: "chore: sync generated OCL"
          title: "chore: sync generated OCL"
          body: |
            Generated OCL updates for:
            ${{ steps.sync.outputs.changed_scripts }}
          add-paths: |
            .octopus/process-templates
